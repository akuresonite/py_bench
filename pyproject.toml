[project]
name = "pybench"
version = "0.1.0"
description = "Compare CPython execution speed across interpreter versions 3.10-3.15, including free-threaded builds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashish Kumar Uchadiya" }]
keywords = ["benchmark", "cpython", "performance", "free-threading", "gil"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Benchmark",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/akuresonite/py_bench"
Issues = "https://github.com/akuresonite/py_bench/issues"

[project.scripts]
pybench = "pybench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pybench"]

[tool.hatch.build.targets.sdist]
include = ["pybench", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
